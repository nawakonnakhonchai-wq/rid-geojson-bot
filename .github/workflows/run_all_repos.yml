name: Run daily repository updates

on:
  workflow_dispatch:
    inputs:
      skip_dam:
        description: 'ข้าม Dam_Daily หากงานเขื่อนของรอบที่สะดุดทำสำเร็จแล้ว'
        type: boolean
        required: false
        default: false

permissions: {}

concurrency:
  group: daily-repository-updates
  cancel-in-progress: false

jobs:
  run-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Dispatch and wait for each repository workflow
        uses: actions/github-script@v7
        env:
          SKIP_DAM: \${{ inputs.skip_dam }}
        with:
          github-token: \${{ secrets.CROSS_REPO_TOKEN }}
          script: |
            const owner = 'nawakonnakhonchai-wq';
            const controlRepo = 'rid-geojson-bot';
            const statusPath = 'agent-dashboard/status.json';
            const queue = [
              { repo: 'Dam_Daily', workflow: 'update_data.yml', label: 'อัปเดตข้อมูลเขื่อน', icon: '🏞️' },
              { repo: 'rid-geojson-bot', workflow: 'realtime_tracker.yml', label: 'อัปเดตข้อมูลระดับน้ำ', icon: '🌊' },
              { repo: 'tmd-earthquake-geojson', workflow: 'earthquake_cron.yml', label: 'อัปเดตข้อมูลแผ่นดินไหว', icon: '🌏' },
              { repo: 'WeatherForecastDaily', workflow: 'openmeteo_update.yml', label: 'อัปเดตพยากรณ์ Open-Meteo', icon: '🌤️' },
              { repo: 'WeatherForecastDaily', workflow: 'weather_update.yml', label: 'อัปเดตพยากรณ์กรมอุตุฯ', icon: '🌦️' },
              { repo: 'WeatherWarningNews', workflow: 'update_data.yml', label: 'อัปเดตข่าวเตือนภัยอากาศ', icon: '⛈️' },
              { repo: 'hii-flood-alert', workflow: 'auto_update.yml', label: 'อัปเดตพื้นที่เฝ้าระวังน้ำท่วม', icon: '🚨' },
            ];
            const startedAt = new Date().toISOString();
            const dashboard = {
              version: 1,
              status: 'running',
              runId: context.runId,
              runUrl: 'https://github.com/' + owner + '/' + controlRepo + '/actions/runs/' + context.runId,
              startedAt,
              updatedAt: startedAt,
              tasks: queue.map((item) => ({ ...item, status: 'queued' })),
            };
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const publishStatus = async () => {
              dashboard.updatedAt = new Date().toISOString();
              try {
                let sha;
                try {
                  const current = await github.rest.repos.getContent({
                    owner, repo: controlRepo, path: statusPath, ref: 'main',
                  });
                  sha = current.data.sha;
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
                const payload = {
                  owner,
                  repo: controlRepo,
                  path: statusPath,
                  message: 'Update agent dashboard status',
                  content: Buffer.from(JSON.stringify(dashboard, null, 2)).toString('base64'),
                  branch: 'main',
                };
                if (sha) payload.sha = sha;
                await github.rest.repos.createOrUpdateFileContents(payload);
              } catch (error) {
                core.warning('แดชบอร์ดอัปเดตสถานะไม่ได้: ' + error.message + ' (ตรวจสิทธิ์ Contents: write ของ CROSS_REPO_TOKEN)');
              }
            };

            if (process.env.SKIP_DAM === 'true') {
              dashboard.tasks[0].status = 'skipped';
              dashboard.tasks[0].detail = 'ข้ามตามตัวเลือกในรอบนี้';
            }
            await publishStatus();

            const deadline = Date.now() + 5 * 60 * 60 * 1000;
            for (let index = 0; index < queue.length; index++) {
              const item = queue[index];
              const task = dashboard.tasks[index];
              if (task.status === 'skipped') continue;
              const repoPath = owner + '/' + item.repo;
              if (Date.now() >= deadline) {
                task.status = 'queued';
                task.detail = 'ไม่ได้เริ่ม: ถึงเวลาสูงสุดของชุดงาน';
                for (const pending of dashboard.tasks.slice(index + 1)) pending.detail = 'ไม่ได้เริ่ม: ถึงเวลาสูงสุดของชุดงาน';
                await publishStatus();
                break;
              }

              task.status = 'running';
              task.startedAt = new Date().toISOString();
              task.detail = 'กำลังเรียก workflow';
              core.info('เริ่ม ' + repoPath + ' / ' + item.workflow);
              await publishStatus();

              let dispatch;
              try {
                dispatch = await github.request(
                  'POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches?return_run_details=true',
                  {
                    owner, repo: item.repo, workflow_id: item.workflow, ref: 'main',
                    headers: { 'X-GitHub-Api-Version': '2026-03-10' },
                  },
                );
              } catch (error) {
                task.status = 'failure';
                task.completedAt = new Date().toISOString();
                task.detail = 'สั่งงานหรือยืนยันผลตอบกลับไม่ได้: ' + error.message;
                for (const pending of dashboard.tasks.slice(index + 1)) pending.detail = 'หยุดคิวเพื่อป้องกันงานซ้อน';
                await publishStatus();
                core.error(repoPath + ': ' + error.message);
                break;
              }

              const runId = dispatch.data?.workflow_run_id;
              const runUrl = dispatch.data?.html_url;
              if (!runId) {
                task.status = 'failure';
                task.completedAt = new Date().toISOString();
                task.detail = 'ยืนยัน run ID ไม่ได้; หยุดคิวเพื่อป้องกันงานซ้อน';
                task.runUrl = runUrl;
                for (const pending of dashboard.tasks.slice(index + 1)) pending.detail = 'หยุดคิวเพื่อป้องกันงานซ้อน';
                await publishStatus();
                break;
              }

              task.runId = runId;
              task.runUrl = runUrl;
              task.detail = 'workflow เริ่มแล้ว กำลังรอผล';
              await publishStatus();

              let finished = false;
              while (Date.now() < deadline) {
                await sleep(15000);
                try {
                  const { data: run } = await github.rest.actions.getWorkflowRun({
                    owner, repo: item.repo, run_id: runId,
                  });
                  if (run.status === 'completed') {
                    task.status = run.conclusion === 'success' ? 'success' : 'failure';
                    task.completedAt = run.updated_at || new Date().toISOString();
                    task.detail = run.conclusion === 'success' ? 'workflow สำเร็จ' : 'workflow จบด้วยสถานะ ' + (run.conclusion || 'ไม่ทราบผล');
                    task.runUrl = run.html_url || runUrl;
                    core.info(repoPath + ': ' + task.detail);
                    finished = true;
                    await publishStatus();
                    break;
                  }
                } catch (error) {
                  core.warning('ตรวจสถานะ ' + repoPath + ' ไม่สำเร็จชั่วคราว จะลองใหม่: ' + error.message);
                }
              }

              if (!finished) {
                task.status = 'failure';
                task.completedAt = new Date().toISOString();
                task.detail = 'เกินเวลารอ; หยุดคิวเพื่อไม่ให้งานซ้อนกัน';
                for (const pending of dashboard.tasks.slice(index + 1)) pending.detail = 'ไม่ได้เริ่ม: งานก่อนหน้าเกินเวลารอ';
                await publishStatus();
                break;
              }
            }

            const hasFailure = dashboard.tasks.some((task) => task.status === 'failure' || task.status === 'queued');
            dashboard.status = hasFailure ? 'failure' : 'success';
            dashboard.completedAt = new Date().toISOString();
            await publishStatus();

            await core.summary
              .addHeading('สรุปการอัปเดตข้อมูลรายวัน')
              .addTable([
                [{ data: 'Repo', header: true }, { data: 'งาน', header: true }, { data: 'สถานะ', header: true }],
                ...dashboard.tasks.map((task) => [
                  task.runUrl ? '[' + task.repo + '](' + task.runUrl + ')' : task.repo,
                  task.label,
                  task.status === 'success' ? 'สำเร็จ' : task.status === 'skipped' ? 'ข้ามแล้ว' : task.status === 'queued' ? 'ไม่ได้เริ่ม' : 'ล้มเหลว',
                ]),
              ])
              .write();

            if (hasFailure) core.setFailed('มีงานล้มเหลวหรือไม่ได้เริ่ม ดูตารางสรุปด้านบน');
