name: Build river paths

# เส้นทางแม่น้ำแทบไม่เปลี่ยน จึงกดรันเองเมื่อต้องการอัปเดต
on:
  workflow_dispatch:

concurrency:
  group: rid-rivers
  cancel-in-progress: true

jobs:
  rivers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build data/rivers.geojson
        run: python -u build_rivers.py

      - name: Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rivers.geojson
          git diff --staged --quiet || (git commit -m "Update river paths from OpenStreetMap" && git pull --rebase && git push)
