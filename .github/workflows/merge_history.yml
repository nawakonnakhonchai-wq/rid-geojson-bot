name: Build merged history

on:
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - run: pip install pandas

      - run: python merge_history.py

      - uses: actions/upload-artifact@v4
        with:
          name: history_all
          path: history_all.csv
