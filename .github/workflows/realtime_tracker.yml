name: RID Realtime Data Tracker

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: rid-tracker
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas geopandas shapely pyogrio

      - name: Run Data Script
        run: python main.py

      - name: Daily Snapshot
        run: python snapshot.py

      - name: Build Dashboard Data
        continue-on-error: true
        run: python build_dashboard_data.py

      - name: Update Dam Data (from Dam_Daily)
        continue-on-error: true
        run: python build_dam_data.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f rid_realtime.geojson ]; then
            git add rid_realtime.geojson history data
            if git diff --staged --quiet; then
              echo "ไม่มีข้อมูลเปลี่ยนแปลง"
              exit 0
            fi
            git commit -m "Auto-update realtime data: $(date)"
            # The daily batch commits agent-dashboard/status.json to main while this job runs,
            # so rebase onto the latest main and retry instead of failing on a non-fast-forward.
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              git rebase --abort 2>/dev/null || true
              echo "push ไม่สำเร็จ (ครั้งที่ $attempt) จะลองใหม่"
              sleep $((attempt * 5))
            done
            echo "push ไม่สำเร็จหลังลอง 5 ครั้ง"
            exit 1
          else
            echo "ไม่พบไฟล์ rid_realtime.geojson ระบบอาจดึงข้อมูลจาก API ไม่สำเร็จ"
            exit 1
          fi
