name: Inspect RID API (diagnostic)

# ตรวจโครงสร้างข้อมูลดิบจาก API (อ่านอย่างเดียว ไม่ commit อะไร) กดรันเอง
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python -u tools/inspect_api.py
